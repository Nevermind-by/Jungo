name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Build development app bundle
        run: Scripts/build-app.sh "$RUNNER_TEMP/Jungo.app"

      - name: Verify app bundle metadata and icon
        run: |
          plutil -lint "$RUNNER_TEMP/Jungo.app/Contents/Info.plist"
          test -s "$RUNNER_TEMP/Jungo.app/Contents/Resources/AppIcon.icns"
          test -x "$RUNNER_TEMP/Jungo.app/Contents/MacOS/Jungo"
